<!doctype html>
<!-- Homepage Editor v1.1.0 - SPDX-License-Identifier: MIT -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Homepage Editor</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>try{var t=localStorage.getItem("he-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#0f141b; --panel:#171e28; --panel2:#1e2733; --line:#2b3644; --text:#e6ebf1; --muted:#97a3b3;
  --accent:#4ea1ff; --accent-ink:#06223f; --ok:#3fb27f; --warn:#e0a63a; --bad:#e5604f;
  --radius:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr-bg:rgba(15,20,27,.96); --field:#0c1117; --line-strong:#43536a; --danger:#ffb4a8; --danger-line:#6e3a33;
  --add:#7ee2a8; --del:#ff9d8f; --toast:#22303f; --warn-line:#6b5326; --warn-bg:#2a2114; --warn-text:#f2d29a;
  --shadow:rgba(0,0,0,.45); color-scheme:dark;
}
/* Light theme: chosen in Configure, or "System" when the computer uses light mode */
:root[data-theme="light"]{--bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#d3dbe4; --text:#16202b; --muted:#566476;
  --accent:#1f6fcc; --accent-ink:#ffffff; --ok:#1f8f5f; --warn:#9a6400; --bad:#c53b2c;
  --hdr-bg:rgba(243,245,248,.96); --field:#ffffff; --line-strong:#9fb0c3; --danger:#b42318; --danger-line:#f1b8b0;
  --add:#18794e; --del:#b42318; --toast:#ffffff; --warn-line:#e3c27a; --warn-bg:#fff6dc; --warn-text:#5f4300;
  --shadow:rgba(20,40,70,.18); color-scheme:light;}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#f3f5f8; --panel:#ffffff; --panel2:#eef2f6; --line:#d3dbe4; --text:#16202b; --muted:#566476;
  --accent:#1f6fcc; --accent-ink:#ffffff; --ok:#1f8f5f; --warn:#9a6400; --bad:#c53b2c;
  --hdr-bg:rgba(243,245,248,.96); --field:#ffffff; --line-strong:#9fb0c3; --danger:#b42318; --danger-line:#f1b8b0;
  --add:#18794e; --del:#b42318; --toast:#ffffff; --warn-line:#e3c27a; --warn-bg:#fff6dc; --warn-text:#5f4300;
  --shadow:rgba(20,40,70,.18); color-scheme:light;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--hdr-bg);border-bottom:1px solid var(--line)}
.bar{margin:0;padding:10px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bar h1{font-size:17px;margin:0 8px 0 0;font-weight:650;display:flex;align-items:center;gap:10px}
.brand-logo{height:32px;max-height:36px;width:auto;max-width:180px;object-fit:contain;display:block;flex:none}
.brand-logo.default{height:28px;border-radius:7px}
/* sun / moon switch (far top right) */
.tt{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 2px 6px 6px;color:var(--text);cursor:pointer;min-height:34px}
.tt svg{width:18px;height:18px;flex:none;transition:opacity .15s}
.tt .track{position:relative;width:38px;height:22px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);transition:background .18s}
.tt .knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--text);transition:left .18s}
.tt[aria-checked="true"] .knob{left:18px}
.tt[aria-checked="true"] .sun,.tt[aria-checked="false"] .moon{opacity:.45}
.tt:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.logo-prev{display:flex;align-items:center;justify-content:center;min-height:70px;padding:12px;border:1px dashed var(--line);border-radius:8px;background:var(--panel2)}
.logo-prev img{max-height:48px;max-width:100%;object-fit:contain}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text);cursor:pointer}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:1px solid transparent;color:var(--muted);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}
nav button[aria-selected=true]{background:var(--panel2);color:var(--text);border-color:var(--line)}
.spacer{flex:1}
a{color:var(--accent)}
/* "Open Homepage": raised (embossed) button; pressed look while clicking */
a.hp-btn{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:7px 14px;border-radius:8px;
  font-weight:650;color:#06223f;text-decoration:none;white-space:nowrap;
  background:linear-gradient(180deg,#7dbbff 0%,#4ea1ff 55%,#2f86e8 100%);
  border:1px solid #1f6fcc;border-top-color:#a9d2ff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 0 #174f93,0 4px 10px var(--shadow);
  text-shadow:0 1px 0 rgba(255,255,255,.3);transition:transform .08s,box-shadow .08s,filter .15s}
a.hp-btn:hover{filter:brightness(1.07)}
a.hp-btn:active{transform:translateY(2px);
  box-shadow:inset 0 2px 4px rgba(0,0,0,.35),0 0 0 #174f93,0 1px 3px rgba(0,0,0,.4)}
a.hp-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
a.hp-btn[hidden]{display:none}
main{min-width:0;max-width:1320px;padding:18px 26px 80px}
.intro{color:var(--muted);margin:0 0 14px;max-width:820px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar.sticky{position:sticky;top:var(--hdr,58px);z-index:4;background:var(--bg);margin:0 -26px 14px;padding:10px 26px;border-bottom:1px solid var(--line)}
button.btn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;font:inherit;min-height:34px}
button.btn:hover{border-color:var(--line-strong)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:650}
button.danger{color:var(--danger)}
button.icon{min-width:34px;padding:6px 8px}
button:disabled{opacity:.45;cursor:not-allowed}
.dirty{color:var(--warn);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.ghead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.ghead input.gname{font-weight:650;font-size:15px;flex:1 1 220px}
.count{color:var(--muted);font-size:12px}
.item{border:1px solid var(--line);border-radius:8px;margin-top:8px;background:var(--panel2)}
.ihead{display:flex;align-items:center;gap:6px;padding:6px 8px;flex-wrap:wrap}
.toggle{flex:1 1 260px;min-width:0;text-align:left;background:none;border:0;color:var(--text);cursor:pointer;font:inherit;padding:6px 4px;display:flex;gap:10px;align-items:baseline}
.toggle b{white-space:nowrap}
.toggle span{color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ibody{padding:4px 12px 12px;border-top:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px 14px;margin-top:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.f.wide{grid-column:1/-1}
input,select,textarea{background:var(--field);color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 9px;font:inherit;min-height:34px;width:100%}
input[type=checkbox]{width:20px;height:20px;min-height:0;padding:0;flex:none;accent-color:var(--accent)}
input[type=range]{min-height:0;border:0;background:none}
textarea{font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.help{color:var(--muted);font-size:12px}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.tag.bad{color:var(--danger);border-color:var(--danger-line)}
.tbl{width:100%;border-collapse:collapse}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px;border-bottom:1px solid var(--line);vertical-align:middle}
.scroll{overflow-x:auto}
.layout-tbl input,.layout-tbl select{min-width:130px}
.layout-tbl td.name{min-width:170px}
h2{font-size:15px;margin:0 0 4px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:900px){.cols{grid-template-columns:1fr}}
.preview{position:relative;height:260px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:#0b0f14}
.preview .img{position:absolute;inset:-30px;background-size:cover;background-position:center}
.preview .cards{position:absolute;inset:0;padding:22px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px;align-content:start}
.preview .pc{height:58px;border-radius:8px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.08);padding:8px 10px;font-size:12px}
.preview .pt{grid-column:1/-1;font-weight:650}
.range{display:flex;gap:8px;align-items:center}
.range input[type=range]{flex:1;padding:0}
.range output{width:36px;text-align:right;font-variant-numeric:tabular-nums}
pre.diff{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;max-height:420px;font:12px/1.5 var(--mono);white-space:pre}
.add{color:var(--add)}.del{color:var(--del)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);max-width:min(680px,92vw);padding:12px 16px;border-radius:9px;background:var(--toast);border:1px solid var(--line);box-shadow:0 8px 30px var(--shadow);display:none;z-index:10;white-space:pre-line}
#toast.ok{border-color:var(--ok)}#toast.bad{border-color:var(--bad)}
.warnbox{border:1px solid var(--warn-line);background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.empty{color:var(--muted);padding:16px;text-align:center}
.hdr-actions{display:flex;gap:8px;align-items:center}
/* ---- V7 layout: sidebar + top bar ---- */
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - var(--hdr,57px))}
aside.side{position:sticky;top:var(--hdr,57px);align-self:start;height:calc(100vh - var(--hdr,57px));border-right:1px solid var(--line);
  padding:14px 10px;display:flex;flex-direction:column;background:var(--panel);overflow:auto}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button,.mside button{display:flex;align-items:center;gap:10px;width:100%;padding:9px 12px;border-radius:8px;border:0;background:none;
  color:var(--muted);font:inherit;text-align:left;cursor:pointer}
.side nav button svg,.mside button svg{width:17px;height:17px;flex:none}
.side nav button:hover,.mside button:hover{background:var(--panel2);color:var(--text)}
.side nav button[aria-selected="true"],.mside button[aria-current="true"]{background:var(--accent);color:var(--accent-ink);font-weight:650}
.side .grow{flex:1}
.side .foot{font-size:12px;color:var(--muted);padding:8px 12px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.ghost{display:inline-flex;align-items:center;gap:7px;background:none;border:1px solid transparent;color:var(--text);padding:7px 10px;border-radius:8px;font:inherit;cursor:pointer;min-height:34px;text-decoration:none}
.ghost:hover{background:var(--panel2)}
.ghost svg{width:17px;height:17px;flex:none}
.icon-only{padding:7px}
a.support{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:9px;font-weight:600;text-decoration:none;
  background:rgba(229,71,107,.14);color:#ff7d98;border:1px solid rgba(229,71,107,.45)}
:root[data-theme="light"] a.support{color:#c42a4f}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) a.support{color:#c42a4f}}
a.support svg{width:15px;height:15px}
a.support[hidden]{display:none}
.avatar{width:32px;height:32px;flex:none;border-radius:50%;background:#e57a2e;color:#fff;font:inherit;font-weight:700;display:grid;place-items:center;border:0;cursor:pointer;text-transform:uppercase}
.avatar:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.nologin{font-size:12px;font-weight:650;color:var(--warn-text);background:var(--warn-bg);border:1px solid var(--warn-line);border-radius:999px;padding:4px 10px;white-space:nowrap}
@media (max-width:1100px){.ghost .lbl,a.support .lbl{display:none}.ghost{padding:7px}}
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  aside.side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}
  .side nav{flex-direction:row;overflow-x:auto}.side nav button{width:auto;white-space:nowrap}
  .side .grow,.side .foot{display:none}
  main{padding:14px 16px 60px}.toolbar.sticky{margin:0 -16px 14px;padding:10px 16px}
  .sep{display:none}
}
@media (max-width:560px){
  .bar{padding:8px 12px;gap:6px}.hdr-actions{gap:4px}
  .tt svg{display:none}.tt{padding:6px 2px}
  a.hp-btn{padding:6px 10px}
  .bar h1{font-size:15px;gap:8px}
}
/* avatar menu */
.menu{position:fixed;right:14px;top:calc(var(--hdr,57px) - 4px);width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  box-shadow:0 12px 40px var(--shadow);padding:6px;z-index:20}
.menu .who{display:flex;gap:10px;align-items:center;padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who small{display:block;color:var(--muted)}
.menu .who .avatar{cursor:default}
.menu [role=menuitem]{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;color:var(--text);text-decoration:none;
  background:none;border:0;font:inherit;cursor:pointer;text-align:left}
.menu [role=menuitem]:hover,.menu [role=menuitem]:focus-visible{background:var(--panel2);outline:none}
.menu [role=menuitem] svg{width:17px;height:17px;color:var(--muted);flex:none}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
.menu .ext{margin-left:auto;color:var(--muted);font-size:12px}
/* windows (settings, feedback) */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:30;padding:16px}
.modal{width:min(900px,100%);height:min(660px,100%);background:var(--bg);border:1px solid var(--line);border-radius:14px;display:grid;
  grid-template-columns:210px minmax(0,1fr);overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal .mside{background:var(--panel);border-right:1px solid var(--line);padding:16px 10px;display:flex;flex-direction:column;gap:2px}
.modal .mside h3{margin:2px 10px 12px;font-size:15px}
.modal .mbody{padding:22px 26px 30px;overflow:auto;position:relative}
.modal .mbody > h2{font-size:18px;margin:0 0 4px}
.xbtn{position:absolute;right:12px;top:10px}
@media (max-width:700px){.modal{grid-template-columns:1fr;grid-template-rows:auto 1fr}.modal .mside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}
  .modal .mside h3{display:none}.mside button{width:auto;white-space:nowrap}}
.small-modal{width:min(500px,100%);height:auto;max-height:100%;overflow:auto;display:block;padding:20px 22px}
.sec{border-top:1px solid var(--line);padding:16px 0}
.sec:first-of-type{border-top:0}
.sec h3{font-size:14px;margin:0 0 4px}
.pwf{position:relative;max-width:400px}
.pwf input{padding-right:42px}
.pwf .eye{position:absolute;right:3px;top:3px;width:32px;height:28px;border:0;border-radius:6px;background:none;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.pwf .eye:hover{color:var(--text);background:var(--panel2)}
.pwf .eye svg{width:17px;height:17px}
.stack{display:flex;flex-direction:column;gap:10px;max-width:400px;margin-top:10px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 0;border-top:1px solid var(--line)}
.setrow:first-child{border-top:0}
.setrow small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.setrow input[type=number]{width:100px}
.pk{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:9px;background:var(--panel);margin-top:8px}
.pk small{display:block;color:var(--muted)}
.pk > svg{width:20px;height:20px;flex:none;color:var(--muted)}
.pk .grow{flex:1;min-width:0}
.about-card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);margin:14px 0}
.about-card h3{display:flex;gap:10px;align-items:center;margin:0 0 8px;font-size:19px}
.links a{display:block;margin:6px 0}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips button{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:9px;font:inherit;cursor:pointer}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2);font-weight:650}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dest label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer;background:var(--panel)}
.dest label:has(input:checked){border-color:var(--accent)}
.dest input{width:18px;height:18px;min-height:0;flex:none;margin-top:2px;accent-color:var(--accent)}
.dest label.off{opacity:.5;cursor:not-allowed}
.fbcol{display:flex;flex-direction:column;gap:12px}
.helpdoc h3{font-size:15px;margin:22px 0 6px}
.helpdoc p,.helpdoc li{max-width:780px}
.helpdoc code{font-family:var(--mono);font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:5px}
button.btn[aria-pressed="true"]{background:var(--panel2);border-color:var(--accent);color:var(--text)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{display:flex;align-items:center;gap:6px;padding:8px 14px;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink);font-weight:650}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-2px}
.cfg{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr));gap:12px;align-items:start}
.cfg .card{margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-top:12px}
.src{font-size:12px;color:var(--muted)}
.src b{color:var(--text);font-weight:600}
dl.about{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 14px;margin:8px 0 0}
dl.about dt{color:var(--muted);font-size:12px;padding-top:1px}
dl.about dd{margin:0;font-family:var(--mono);font-size:12.5px;overflow-wrap:anywhere}
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1><img id="brand-logo" class="brand-logo default" src="/favicon.svg" alt=""><span id="brand-title">Homepage Editor</span></h1>
    <span class="spacer"></span>
    <div class="hdr-actions">
    <a id="hp-link" class="hp-btn" href="#" target="_blank" rel="noopener" hidden>Open Homepage <span aria-hidden="true">↗</span></a>
    <span class="sep" aria-hidden="true"></span>
    <button class="ghost" id="fb-btn" title="Share feedback or ask a question"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span class="lbl">Feedback</span></button>
    <button class="ghost icon-only" id="help-btn" aria-label="Help" title="Help"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9.5"/><path d="M9.5 9.3a2.6 2.6 0 0 1 5 .9c0 1.8-2.5 2.2-2.5 3.8"/><circle cx="12" cy="17.2" r=".6" fill="currentColor"/></svg></button>
    <a class="support" id="support-btn" href="#" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.3C.8 8.1 3.1 4.5 6.7 4.5c2.1 0 3.6 1.1 5.3 3 1.7-1.9 3.2-3 5.3-3 3.6 0 5.9 3.6 4.3 7.2C19.5 16.4 12 21 12 21z"/></svg><span class="lbl">Support us</span></a>
    <button class="tt" id="theme-toggle" role="switch" aria-checked="false" aria-label="Dark mode" title="Switch between light and dark">

/* ---------- helpers ---------- */
function h(tag, attrs, ...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===undefined||v===null||v===false) continue;
    if(k.startsWith("on")) e.addEventListener(k.slice(2),v);
    else if(k==="value") e.value=v;
    else if(k==="checked") e.checked=v;
    else e.setAttribute(k, v===true?"":v);
  }
  for(const c of kids.flat()){ if(c===null||c===undefined||c===false) continue;
    e.append(c instanceof Node?c:document.createTextNode(String(c))); }
  return e;
}
async function api(method,url,body){
  const r=await fetch(url,{method,headers:{"Content-Type":"application/json","X-Requested-With":"homepage-editor"},
    body:body===undefined?undefined:JSON.stringify(body)});
  const t=await r.text(); let d; try{d=JSON.parse(t)}catch(e){d={error:t}}
  if(r.status===401&&d.login){S.dirty={};location.href="/login";throw new Error("Please log in again.");}
  if(!r.ok) throw new Error(d.error||("HTTP "+r.status));
  return d;
}
let toastTimer;
function toast(msg,kind){const t=document.getElementById("toast");t.textContent=msg;t.className=kind||"";
  t.style.display="block";clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.style.display="none",kind==="bad"?12000:7000);}
function savedMsg(res){
  if(!res.changed) return res.message||"No changes to save.";
  const b=res.backup?("Previous version backed up: "+res.backup.date+" "+res.backup.time):
    "The previous version was already in your newest backup.";
  return "Saved. "+b+"\nIn Homepage, click the refresh icon (bottom right) to see the change.";
}
function markDirty(key){if(!key)return;S.dirty[key]=true;updateDirty();}
function updateDirty(){document.querySelectorAll("[data-dirty]").forEach(e=>{e.hidden=!S.dirty[e.dataset.dirty]});}
window.addEventListener("beforeunload",e=>{if(Object.values(S.dirty).some(Boolean)){e.preventDefault();e.returnValue="";}});
function move(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return false;[arr[i],arr[j]]=[arr[j],arr[i]];return true;}
function field(label,input,opts){return h("label",{class:"f"+(opts&&opts.wide?" wide":"")},label,input,opts&&opts.help?h("span",{class:"help"},opts.help):null);}
function text(obj,key,dk,ph,onchange){return h("input",{value:obj[key]??"",placeholder:ph||"",
  oninput:e=>{obj[key]=e.target.value;markDirty(dk);if(onchange)onchange();}});}
function select(obj,key,dk,options,onchange){
  const s=h("select",{onchange:e=>{const o=options[e.target.selectedIndex];obj[key]=o[0];markDirty(dk);if(onchange)onchange();}},
    options.map(o=>h("option",{},o[1])));
  const idx=options.findIndex(o=>o[0]===obj[key]||(o[0]===null&&(obj[key]===undefined||obj[key]===null)));
  if(idx>=0) s.selectedIndex=idx;
  else if(obj[key]!==undefined&&obj[key]!==null&&obj[key]!==""){s.append(h("option",{},String(obj[key])+" (current)"));
    options.push([obj[key],String(obj[key])]);s.selectedIndex=options.length-1;}
  return s;
}

async function showItems(tab){

  const m=document.getElementById("main");

    list.innerHTML="";

          h("button",{class:"btn",onclick:()=>{const n={name:"New "+def.kind,extra:"",_open:true};def.fields.forEach(f=>n[f[0]]="");g.items.push(n);markDirty(tab);render();}},"+ Add "+def.kind),
          h("button",{class:"btn danger",onclick:()=>{if(confirmTwice("Delete the group '"+g.name+"' and its "+g.items.length+" "+def.kind+"s?")){data.groups.splice(gi,1);markDirty(tab);render();}}},"Delete group")),
        items));
    });
    list.append(h("button",{class:"btn",onclick:()=>{data.groups.push({name:"New group",items:[]});markDirty(tab);render();}},"+ Add group"));
  }
  function itemRow(g,gi,it,ii){
    const sub=h("span",{},it.href||"");
    const head=h("div",{class:"ihead"},
      h("button",{class:"toggle","aria-expanded":String(!!it._open),onclick:()=>{it._open=!it._open;render();}},
        h("span",{"aria-hidden":"true"},it._open?"▾":"▸"),h("b",{},it.name||"(no name)"),sub),
      h("button",{class:"btn icon",title:"Move up","aria-label":"Move up",onclick:()=>{if(move(g.items,ii,-1)){markDirty(tab);render();}}},"↑"),
      h("button",{class:"btn icon",title:"Move down","aria-label":"Move down",onclick:()=>{if(move(g.items,ii,1)){markDirty(tab);render();}}},"↓"),
      h("select",{"aria-label":"Move to group",style:"width:auto",onchange:e=>{const t=+e.target.value;if(t>=0&&t!==gi){g.items.splice(ii,1);data.groups[t].items.push(it);markDirty(tab);render();}}},
        h("option",{value:"-1"},"Move to…"),data.groups.map((x,xi)=>xi===gi?null:h("option",{value:String(xi)},x.name))),
      h("button",{class:"btn",title:"Duplicate",onclick:()=>{const c=JSON.parse(JSON.stringify(it));c.name=it.name+" copy";c._open=true;g.items.splice(ii+1,0,c);markDirty(tab);render();}},"Copy"),
      h("button",{class:"btn danger",onclick:()=>{if(confirmTwice("Delete '"+it.name+"'?")){g.items.splice(ii,1);markDirty(tab);render();}}},"Delete"));
    const row=h("div",{class:"item"},head);
    if(it._open){
      const grid=h("div",{class:"grid"},
        field("Name",text(it,"name",tab,"",()=>{head.querySelector("b").textContent=it.name||"(no name)";})),
        def.fields.map(([k,label,ph,opts])=>field(label,opts?select(it,k,tab,opts.map(o=>[o[0],o[1]])):
          text(it,k,tab,ph,k==="href"?()=>{sub.textContent=it.href;}:null))),
        field("Advanced (YAML)",h("textarea",{rows:Math.max(4,(it.extra||"").split("\n").length+1),value:it.extra||"",
          spellcheck:"false",placeholder:def.adv,oninput:e=>{it.extra=e.target.value;markDirty(tab);}}),
          {wide:true,help:"For widgets, server/container, showStats and anything not in the boxes above. Indent with spaces, not tabs."}));
      row.append(h("div",{class:"ibody"},grid));
    }

  }

async function showLayout(){

      body.append(h("tr",{},
        h("td",{},h("button",{class:"btn icon","aria-label":"Move up",onclick:()=>{if(move(rows,i,-1)){markDirty("layout");render();}}},"↑"),
                  h("button",{class:"btn icon","aria-label":"Move down",onclick:()=>{if(move(rows,i,1)){markDirty("layout");render();}}},"↓")),

        h("td",{},select(r,"initiallyCollapsed","layout",TRI.map(x=>[...x]))),

      h("div",{class:"setrow"},h("div",{},h("b",{},"Log out after inactivity (minutes)"),h("small",{},"0 = never. Not used when \"Stay logged in\" was ticked at login.")),idle),
      h("div",{class:"setrow"},h("div",{},h("b",{},"\"Stay logged in\" lasts (days)"),h("small",{},"For the tick box on the login page: 1 to 365.")),days),
      h("div",{class:"row"},saveS,everywhere),
      h("p",{class:"help"},"After 5 wrong passwords in a row, logging in from that address is blocked for 5 minutes. "+(c.login.remembered?"This browser is set to stay logged in.":"")))];

const b64u={dec:s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"===".slice((s.length+3)%4)),c=>c.charCodeAt(0)).buffer,
  enc:b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")};
function pPasskeys(c,reload){
  const sec=h("div",{class:"sec"},h("h3",{},"Passkeys"));
  if(!c.passkeys.available){sec.append(h("p",{class:"src"},"Passkeys are not available in this installation."));return sec;}
  const can=window.isSecureContext&&!!window.PublicKeyCredential;
  sec.append(h("p",{class:"src"},"Log in with your fingerprint, face, PIN or a security key instead of the password. Saved passkeys also work in password managers like Bitwarden."));
  if(!can) sec.append(h("div",{class:"warnbox"},"Your browser only allows passkeys on https:// pages (or http://localhost). Open the editor through your reverse proxy with a domain and HTTPS, e.g. https://editor.example.com, to add one."));
  c.passkeys.list.forEach(p=>sec.append(h("div",{class:"pk"},icon("key"),
    h("div",{class:"grow"},h("b",{},p.name),h("small",{},"For "+p.rp+" · added "+p.added+(p.used?" · last used "+p.used:""))),
    h("button",{class:"btn danger",onclick:async()=>{if(!confirmTwice("Remove the passkey \""+p.name+"\"?"))return;
      try{await api("DELETE","/api/passkey/"+encodeURIComponent(p.id));toast("Passkey removed.","ok");reload();}catch(e){toast(e.message,"bad");}}},"Remove"))));
  if(!c.passkeys.list.length) sec.append(h("p",{class:"help"},"No passkeys yet."));
  const name=h("input",{placeholder:"Name, e.g. Laptop or Phone",maxlength:"60",style:"max-width:260px","aria-label":"Passkey name"});
  const add=h("button",{class:"btn primary",disabled:!can,onclick:async()=>{
    add.disabled=true;
    try{
      const o=await api("POST","/api/passkey/register/options");
      o.challenge=b64u.dec(o.challenge);o.user.id=b64u.dec(o.user.id);(o.excludeCredentials||[]).forEach(x=>x.id=b64u.dec(x.id));
      const cred=await navigator.credentials.create({publicKey:o});const r=cred.response;
      await api("POST","/api/passkey/register/verify",{name:name.value,credential:{id:cred.id,rawId:b64u.enc(cred.rawId),type:cred.type,
        clientExtensionResults:cred.getClientExtensionResults(),
        response:{clientDataJSON:b64u.enc(r.clientDataJSON),attestationObject:b64u.enc(r.attestationObject),
          transports:r.getTransports?r.getTransports():[]}}});
      toast("Passkey added. Next time, choose \"Log in with a passkey\" on the login page.","ok");reload();
    }catch(e){toast(e.name==="NotAllowedError"?"Adding the passkey was cancelled.":e.message,"bad");add.disabled=false;}}},"Add a passkey");
  sec.append(h("div",{class:"row"},name,add));
  return sec;
}

function pHomepage(c,reload){
  const H={protocol:c.homepage.protocol,host:c.homepage.host,port:c.homepage.port};
  const urlOut=h("code",{});
  const upd=()=>{const host=(H.host||"").replace(/^[a-z]+:\/\//i,"").split("/")[0];const p=(H.port||"").trim();
    const def=(H.protocol==="http"&&p==="80")||(H.protocol==="https"&&p==="443");
    urlOut.textContent=host?H.protocol+"://"+host+(p&&!def?":"+p:""):"(no link: host is empty)";};
  const save=h("button",{class:"btn primary",onclick:async()=>{save.disabled=true;
    try{const r=await api("PUT","/api/config/homepage",H);setHpLink(r.url);toast("Saved. Open Homepage now goes to "+(r.url||"(nothing)")+".","ok");reload();}
    catch(e){toast(e.message,"bad");save.disabled=false;}}},"Save link");
  const sh=c.homepage.setup, setupUrl=(sh.host?sh.protocol+"://"+sh.host+(sh.port?":"+sh.port:""):"(none)");
  const reset=c.homepage.source==="editor"?h("button",{class:"btn",onclick:async()=>{
    try{const r=await api("DELETE","/api/config/homepage");setHpLink(r.url);toast("Back to the setup value: "+(r.url||"(none)"),"ok");reload();}catch(e){toast(e.message,"bad");}}},"Use setup value ("+setupUrl+")"):null;
  upd();
  return [h("h2",{},"Homepage link"),h("p",{class:"intro"},"Where the Open Homepage button goes."),warnData(c),src(c.homepage.source),
    h("div",{class:"grid"},field("Protocol",select(H,"protocol",null,[["http","http"],["https","https"]],upd)),
      field("IP address or host name",text(H,"host",null,"e.g. 192.168.1.10 or home.example.com",upd),{help:"No http:// and no port here."}),
      field("Port",text(H,"port",null,"empty = no port (80/443)",upd),{help:"Empty = no port: the browser uses 80 (http) or 443 (https)."})),
    h("p",{class:"help"},"Link: ",urlOut),h("div",{class:"row"},save,reset)];
}

function pBackups(c,reload){
  const keep=h("input",{type:"number",min:"0",max:"100000",value:c.backups.keep,style:"max-width:140px","aria-label":"Backups to keep"});
  const save=h("button",{class:"btn primary",onclick:async()=>{save.disabled=true;

  return [h("h2",{},"Backups"),h("p",{class:"intro"},"A dated backup of all config files is made before every save and restore."),warnData(c),src(c.backups.source),
    h("div",{class:"row"},field("How many backups to keep (0 = keep all)",keep),save,reset),

    h("div",{class:"row"},h("button",{class:"btn",onclick:()=>{closeOverlay();go("backups");}},"Open the Backups page"))];
}

/* ---------- feedback ---------- */
function openFeedback(){
  const L=S.info.links||{}, hasGH=!!L.issues, hasDC=!!L.discord;
  const F={type:"Idea / suggestion",rating:"",text:"",dest:hasGH?"github":(hasDC?"discord":"copy"),meta:true};
  const types=["Idea / suggestion","Bug","Question","Other"];
  const chips=h("div",{class:"chips"},["Great","Okay","Had an issue","Missing something"].map(r=>
    h("button",{type:"button","aria-pressed":"false",onclick:e=>{F.rating=F.rating===r?"":r;chips.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.textContent===F.rating)));}},r)));
  const ta=h("textarea",{rows:"5",placeholder:"Tell what worked, what broke, or what would make the editor better.",oninput:e=>{F.text=e.target.value;go2.disabled=!F.text.trim();}});
  const dest=(id,title,sub,ok)=>h("label",{class:ok?"":"off"},h("input",{type:"radio",name:"fbdest",value:id,checked:F.dest===id,disabled:!ok,onchange:()=>{F.dest=id;}}),
    h("span",{},h("b",{},title),h("br"),h("small",{class:"help"},ok?sub:"Not set up yet")));
  const message=()=>{
    const lines=["**Type:** "+F.type];
    if(F.rating) lines.push("**Rating:** "+F.rating);
    lines.push("",F.text.trim());
    if(F.meta) lines.push("","---","Homepage Editor "+S.info.version+" · "+navigator.userAgent);
    return lines.join("\n");
  };
  const go2=h("button",{class:"btn primary",disabled:true,onclick:async()=>{
    const msg=message();
    if(F.dest==="github"){
      const title=F.type.split(" ")[0]+": "+F.text.trim().split("\n")[0].slice(0,70);
      window.open(L.issues+"/new?title="+encodeURIComponent(title)+"&body="+encodeURIComponent(msg),"_blank","noopener");
      closeOverlay();toast("GitHub opened in a new tab with your text. Check it and press Create there.","ok");
    }else{
      try{await navigator.clipboard.writeText(msg);}catch(e){ta.value=msg;ta.select();toast("Copy the text with Ctrl+C, then paste it.","bad");return;}
      if(F.dest==="discord"){window.open(L.discord,"_blank","noopener");closeOverlay();toast("Your text is copied. Paste it in the Discord channel (Ctrl+V).","ok");}
      else{closeOverlay();toast("Your text is copied to the clipboard.","ok");}
    }}},"Continue ↗");
  const box=h("div",{class:"modal small-modal",role:"dialog","aria-modal":"true","aria-label":"Share feedback"},
    h("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"},h("h2",{style:"margin:0;font-size:18px"},"Share feedback"),
      h("button",{class:"ghost icon-only","aria-label":"Close",onclick:closeOverlay},"✕")),
    h("p",{class:"help",style:"margin:0 0 14px"},"Nothing is sent by the editor itself. You choose where it goes and see the message before posting it. Your config, API keys and addresses are never included."),
    h("div",{class:"fbcol"},
      field("Feedback type",h("select",{onchange:e=>{F.type=types[e.target.selectedIndex];}},types.map(t=>h("option",{},t)))),
      h("div",{class:"f"},"Quick rating",chips),
      field("Feedback",ta),
      h("div",{class:"f"},"Send it via",h("div",{class:"dest"},
        dest("github","GitHub","Opens a new issue with your text filled in",hasGH),
        dest("discord","Discord","Copies your text and opens the server",hasDC))),
      (!hasGH&&!hasDC)?h("p",{class:"help"},"No GitHub or Discord link is set up yet: Continue copies your text to the clipboard."):null,
      h("label",{class:"chk"},h("input",{type:"checkbox",checked:true,onchange:e=>{F.meta=e.target.checked;}}),"Add the editor version and browser (no other data)"),
      h("div",{style:"display:flex;justify-content:flex-end;gap:8px"},h("button",{class:"btn",onclick:closeOverlay},"Cancel"),go2)));
  overlay(box);
}

/* ---------- start ---------- */
(async()=>{
  const setHdr=()=>document.documentElement.style.setProperty('--hdr',document.querySelector('header').offsetHeight+'px');
  renderTabs();setHdr();window.addEventListener('resize',setHdr);
  if(window.ResizeObserver) new ResizeObserver(setHdr).observe(document.querySelector('header'));
  document.getElementById("theme-toggle").addEventListener("click",toggleTheme);
  document.getElementById("avatar").addEventListener("click",toggleMenu);
  document.getElementById("fb-btn").addEventListener("click",openFeedback);
  document.getElementById("help-btn").addEventListener("click",()=>go("help"));
  document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeMenu();closeOverlay();}});
  document.addEventListener("click",e=>{const m=document.getElementById("menu");if(!m.hidden&&!m.contains(e.target)&&e.target.id!=="avatar")closeMenu();});
  if(darkMQ&&darkMQ.addEventListener) darkMQ.addEventListener("change",syncToggle);
  syncToggle();
  await refreshInfo();
  show();
})();
