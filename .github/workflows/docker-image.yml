# Homepage Editor - builds the ready image and publishes it on GitHub (ghcr.io).
# SPDX-License-Identifier: MIT
#
# Publishing a version: create a tag like v1.0.0 (e.g. by making a Release on GitHub).
# The image then gets the tags 1.0.0, 1.0, 1 and latest, for linux/amd64 and linux/arm64.
# "Run workflow" by hand (Actions tab) only TEST-builds both platforms: nothing is uploaded.
# So the only way to publish an image is a version tag that you create.
name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Image name (lowercase, as ghcr.io requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homepage-editor" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v4        # lets the amd64 runner build arm64 too
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Homepage Editor
            org.opencontainers.image.description=Web editor for Homepage (gethomepage.dev) config, with dated backups
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: ./editor
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}   # manual run: build only, no upload
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
