# Homepage Editor v1.1.1 - give the stack a fixed Docker network instead of letting Docker choose.
# SPDX-License-Identifier: MIT
#
# Only needed when Docker cannot find a free network itself ("could not find an available,
# non-overlapping IPv4 address pool"), or when you want a known address range.
# setup.sh adds this file for you. By hand, in .env:
#   EDITOR_SUBNET='10.0.10.0/24'           (a range no other network uses)
#   COMPOSE_FILE='docker-compose.yml:docker-compose.subnet.yml'
networks:
  default:
    ipam:
      config:
        - subnet: ${EDITOR_SUBNET:?Set EDITOR_SUBNET in .env, e.g. 10.0.10.0/24, or remove docker-compose.subnet.yml from COMPOSE_FILE}
